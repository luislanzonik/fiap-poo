<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="480" viewBox="0 0 1150 480" role="img" aria-label="Fluxo de polimorfismo e interface">
<defs><style>text{font-family:Arial,sans-serif;fill:#18283d}.title{font-size:27px;font-weight:700}.main{font-size:18px;font-weight:700}.small{font-size:15px}.sub{font-size:14px;fill:#526680}.box{fill:white;stroke:#6a7b91;stroke-width:2}.shade{fill:#e4eefb;stroke:#59799d;stroke-width:2}.ok{fill:#e8f5ed;stroke:#588a6c;stroke-width:2}.arrow{fill:none;stroke:#66788f;stroke-width:3;stroke-linejoin:round}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#66788f" stroke-width="2"/></marker></defs>
<rect width="1150" height="480" fill="#f7f9fd"/>
<text x="45" y="50" class="title">Interfaces e polimorfismo — mesmo contrato, respostas específicas</text>
<rect x="55" y="150" rx="16" width="235" height="143" class="shade"/>
<text x="172" y="193" class="main" text-anchor="middle">List&lt;Conectavel&gt;</text>
<text x="172" y="228" class="small" text-anchor="middle">Android</text><text x="172" y="256" class="small" text-anchor="middle">Iphone</text>
<path d="M290 222H378" class="arrow" marker-end="url(#a)"/>
<rect x="398" y="157" rx="16" width="265" height="133" class="box"/>
<text x="530" y="193" class="main" text-anchor="middle">for (dispositivo)</text>
<text x="530" y="229" class="small" text-anchor="middle">dispositivo.conectar()</text>
<text x="530" y="256" class="sub" text-anchor="middle">Um único comando</text>
<path d="M663 222H710V145H760" class="arrow" marker-end="url(#a)"/>
<path d="M710 222V313H760" class="arrow" marker-end="url(#a)"/>
<rect x="780" y="87" rx="16" width="320" height="129" class="ok"/>
<text x="940" y="130" class="main" text-anchor="middle">Android</text>
<text x="940" y="160" class="small" text-anchor="middle">conectar():</text>
<text x="940" y="187" class="small" text-anchor="middle">“Android conectado ao Wi-Fi”</text>
<rect x="780" y="259" rx="16" width="320" height="129" class="ok"/>
<text x="940" y="302" class="main" text-anchor="middle">Iphone</text>
<text x="940" y="332" class="small" text-anchor="middle">conectar():</text>
<text x="940" y="359" class="small" text-anchor="middle">“iPhone conectado ao Wi-Fi”</text>
<text x="58" y="443" class="sub">A interface obriga as classes a implementar conectar(); não há uma conexão real de rede nesta simulação.</text>
</svg>