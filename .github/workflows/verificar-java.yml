name: Verificar compilacao Java
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  java:
    name: Compilar e executar projetos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar todos os arquivos Java
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build $(find src -name '*.java')
      - name: Executar exemplo FiapRide
        run: java -cp build br.com.fiapride.main.DemonstracaoFiapRide
      - name: Executar projeto pessoal
        run: java -cp build br.com.fiapride.main.SistemaPrincipal
